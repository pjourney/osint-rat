# Required on every pull request, including phase PRs:
#   cargo fmt --all -- --check
#   cargo clippy --all-targets -- -D warnings
#   cargo test --all-targets
# Phase PRs must also include tests for any new or changed model/storage path
# (see CONTRIBUTING.md and PHASED_ROADMAP.md). Do not treat collector count
# as a success signal.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Colour roles stay in theme.rs
        run: |
          leaks=$(grep -R --include='*.rs' -n 'Color::' src | grep -v 'src/tui/theme.rs' || true)
          if [ -n "$leaks" ]; then
            echo "Color:: must live only in src/tui/theme.rs:"
            echo "$leaks"
            exit 1
          fi
      - name: Doctor (smoke)
        run: cargo run --quiet -- doctor
      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - name: Security audit
        run: cargo audit
