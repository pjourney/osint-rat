[package]
name = "os-int"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An open-source intelligence (OSINT) investigation workbench for the terminal, with first-class AI agent CLI integration"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pjourney/osint-rat"
readme = "README.md"
keywords = ["osint", "tui", "ratatui", "investigation", "security"]
categories = ["command-line-utilities"]

[lib]
name = "os_int"
path = "src/lib.rs"

[[bin]]
name = "os-int"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
hex = "0.4.3"
hickory-resolver = "0.26.3"
infer = "0.22.0"
ratatui = "0.30.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["gzip", "socks"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "time", "sync", "signal", "fs", "net", "io-util", "test-util"] }
tokio-rustls = "0.26.6"
tokio-util = "0.7.19"
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
webpki-roots = "1.0.9"
x509-parser = "0.18.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
